server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location /metrics { proxy_pass http://api:8000; }
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
